name: agrismart
description: "A smart agriculture app for framers to monitor and manage their crops effectively."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.11.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.0       
  google_fonts: ^6.1.0       
  percent_indicator: ^4.2.3  
  sqflite: ^2.3.0     
  onnxruntime: ^1.4.1       
  path: ^1.8.3
  shared_preferences: ^2.5.5
  sqflite_common_ffi: ^2.4.0+3
  camera: ^0.12.0+1
  http: ^1.6.0
  url_launcher: ^6.3.2
  youtube_player_flutter: ^9.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/ml/rf_fertilizer_classifier.onnx
    - assets/ml/rf_moisture_regressor.onnx
    - assets/ml/rf_soil_classifier.onnx